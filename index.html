<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyDriveX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080b12;
    --card:#111722;
    --card2:#151c28;
    --border:#273142;
    --text:#f5f7fb;
    --muted:#8d99aa;
    --blue:#3b82f6;
    --blue2:#2563eb;
    --danger:#ef4444;
    --danger-bg:#32171b;
    --green:#22c55e;
}

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   AUTH
========================= */

#authPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-card{
    width:100%;
    max-width:430px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:32px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.auth-logo{
    text-align:center;
    font-size:32px;
    font-weight:800;
    margin-bottom:10px;
}

.auth-logo span,
.logo span{
    color:var(--blue);
}

.auth-title{
    text-align:center;
    color:var(--muted);
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#0b1019;
    color:white;
    outline:none;
}

.input:focus{
    border-color:var(--blue);
}

.auth-btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:12px;
    background:var(--blue2);
    color:white;
    font-weight:700;
}

.switch-btn{
    width:100%;
    border:0;
    background:transparent;
    color:#60a5fa;
    margin-top:18px;
}

#authMessage{
    margin-top:15px;
    text-align:center;
    font-size:14px;
}

/* =========================
   HEADER
========================= */

.header{
    height:70px;
    background:#0d121b;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:24px;
    font-weight:800;
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.user{
    color:var(--muted);
    font-size:14px;
}

.logout{
    border:0;
    background:var(--danger-bg);
    color:#ff9a9a;
    padding:9px 13px;
    border-radius:9px;
}

/* =========================
   MAIN
========================= */

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 18px;
}

.welcome{
    margin-bottom:22px;
}

.welcome h1{
    font-size:30px;
    margin-bottom:7px;
}

.welcome p{
    color:var(--muted);
}

/* =========================
   PROFILE
========================= */

.profile-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:20px;
}

.avatar{
    width:82px;
    height:82px;
    border-radius:50%;
    object-fit:cover;
    object-position:center;
    background:#1c2533;
    border:2px solid var(--border);
    display:block;
}

.avatar-placeholder{
    width:82px;
    height:82px;
    border-radius:50%;
    background:#1c2533;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
}

.profile-info{
    flex:1;
}

.profile-name{
    font-size:20px;
    font-weight:700;
    margin-bottom:5px;
}

.profile-email{
    color:var(--muted);
    font-size:14px;
    margin-bottom:12px;
}

.profile-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.small-btn{
    border:0;
    padding:8px 11px;
    border-radius:8px;
    background:#1e293b;
    color:white;
}

.small-btn.blue{
    background:var(--blue2);
}

.small-btn.red{
    background:var(--danger-bg);
    color:#ff9a9a;
}

#avatarInput{
    display:none;
}

/* =========================
   STORAGE
========================= */

.storage-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    margin-bottom:20px;
}

.storage-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.storage-title{
    font-weight:700;
}

.storage-value{
    color:var(--muted);
    font-size:14px;
}

.progress{
    height:9px;
    background:#202938;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:var(--blue);
    transition:.3s;
}

/* =========================
   UPLOAD
========================= */

.upload-box{
    background:var(--card);
    border:2px dashed #334155;
    border-radius:20px;
    padding:28px 20px;
    text-align:center;
    margin-bottom:20px;
}

.upload-box h2{
    margin-bottom:8px;
}

.upload-box p{
    color:var(--muted);
    margin-bottom:18px;
}

.upload-btn{
    display:inline-block;
    background:var(--blue2);
    color:white;
    padding:13px 20px;
    border-radius:11px;
    font-weight:700;
    margin:4px;
}

.upload-btn.folder-btn{
    background:#1e293b;
}

#fileInput,
#folderInput{
    display:none;
}

#uploadStatus{
    margin-top:13px;
    color:var(--muted);
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:15px;
    margin-bottom:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:200px;
    padding:11px 13px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0b1019;
    color:white;
    outline:none;
}

.action-btn{
    border:0;
    padding:10px 14px;
    border-radius:10px;
    background:#1e293b;
    color:white;
}

.action-btn.blue{
    background:var(--blue2);
}

/* =========================
   FILE CARD
========================= */

.files-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
}

.files-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:18px;
}

.files-header h2{
    font-size:20px;
}

.path{
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
}

.back-btn{
    border:0;
    background:#1e293b;
    color:white;
    padding:9px 13px;
    border-radius:9px;
}

/* =========================
   ITEM
========================= */

.file{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:14px 5px;
    border-bottom:1px solid #202938;
}

.file:last-child{
    border-bottom:0;
}

.file-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.file-icon{
    width:43px;
    height:43px;
    border-radius:11px;
    background:#1c2533;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    flex-shrink:0;
}

.file-info{
    min-width:0;
}

.file-name{
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.file-size{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.file-actions{
    display:flex;
    gap:7px;
    flex-shrink:0;
}

.btn{
    border:0;
    padding:8px 11px;
    border-radius:8px;
    background:#1e293b;
    color:white;
}

.btn.delete{
    background:var(--danger-bg);
    color:#ff9a9a;
}

.btn.preview{
    background:#172554;
    color:#93c5fd;
}

/* =========================
   FOLDER
========================= */

.folder{
    background:#111a27;
}

.folder .file-icon{
    background:#172554;
}

.folder-name{
    color:#bfdbfe;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:40px 15px;
    color:var(--muted);
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal-box{
    width:100%;
    max-width:800px;
    max-height:90vh;
    overflow:auto;
    background:#0f151f;
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.close-btn{
    border:0;
    background:#32171b;
    color:#ff9a9a;
    padding:8px 11px;
    border-radius:8px;
}

.preview-image{
    max-width:100%;
    max-height:70vh;
    display:block;
    margin:auto;
    border-radius:10px;
}

.preview-video{
    width:100%;
    max-height:70vh;
    border-radius:10px;
}

.preview-audio{
    width:100%;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .header{
        padding:0 13px;
    }

    .logo{
        font-size:20px;
    }

    .user{
        display:none;
    }

    .container{
        margin-top:18px;
        padding:0 10px;
    }

    .welcome h1{
        font-size:24px;
    }

    .profile-card{
        flex-direction:column;
        align-items:flex-start;
    }

    .avatar,
    .avatar-placeholder{
        width:70px;
        height:70px;
    }

    .profile-actions{
        width:100%;
    }

    .small-btn{
        flex:1;
    }

    .toolbar{
        flex-direction:column;
    }

    .search{
        width:100%;
        min-width:0;
    }

    .action-btn{
        width:100%;
    }

    .files-card{
        padding:13px;
    }

    .file{
        align-items:flex-start;
        flex-direction:column;
    }

    .file-left{
        width:100%;
    }

    .file-actions{
        width:100%;
    }

    .file-actions .btn{
        flex:1;
    }

    .files-header{
        align-items:flex-start;
    }

    .upload-btn{
        display:block;
        width:100%;
        margin:6px 0;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     AUTH
===================================================== -->

<section id="authPage">

    <div class="auth-card">

        <div class="auth-logo">
            Sky<span>DriveX</span>
        </div>

        <p class="auth-title" id="authTitle">
            Hisobingizga kiring
        </p>

        <input
            type="email"
            id="email"
            class="input"
            placeholder="Email">

        <input
            type="password"
            id="password"
            class="input"
            placeholder="Parol">

        <button
            class="auth-btn"
            id="authButton"
            onclick="login()">
            Kirish
        </button>

        <button
            class="switch-btn"
            id="switchButton"
            onclick="toggleAuth()">
            Hisobingiz yo‘qmi? Ro‘yxatdan o‘ting
        </button>

        <div id="authMessage"></div>

    </div>

</section>


<!-- =====================================================
     CLOUD
===================================================== -->

<section id="cloudPage" class="hidden">

<header class="header">

    <div class="logo">
        Sky<span>DriveX</span>
    </div>

    <div class="header-right">

        <div
            class="user"
            id="userEmail">
        </div>

        <button
            class="logout"
            onclick="logout()">
            Chiqish
        </button>

    </div>

</header>


<main class="container">

<!-- WELCOME -->

<section class="welcome">

    <h1>☁️ Mening SkyDriveX</h1>

    <p>
        Fayllaringizni xavfsiz saqlang va
        istalgan qurilmadan foydalaning.
    </p>

</section>


<!-- =====================================================
     PROFILE
===================================================== -->

<section class="profile-card">

    <div id="avatarContainer">

        <div class="avatar-placeholder">
            👤
        </div>

    </div>

    <div class="profile-info">

        <div
            class="profile-name"
            id="profileName">
            SkyDriveX foydalanuvchisi
        </div>

        <div
            class="profile-email"
            id="profileEmail">
        </div>

        <div class="profile-actions">

            <label
                for="avatarInput"
                class="small-btn blue">
                👤 Rasm yuklash
            </label>

            <input
                type="file"
                id="avatarInput"
                accept="image/*">

            <button
                class="small-btn"
                onclick="changeAvatar()">
                🔄 Almashtirish
            </button>

            <button
                class="small-btn red"
                onclick="deleteAvatar()">
                🗑️ Rasmni o‘chirish
            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     STORAGE
===================================================== -->

<section class="storage-card">

    <div class="storage-top">

        <div class="storage-title">
            ☁️ Storage
        </div>

        <div
            class="storage-value"
            id="storageText">
            0 B
        </div>

    </div>

    <div class="progress">

        <div
            class="progress-bar"
            id="storageBar">
        </div>

    </div>

</section>


<!-- =====================================================
     UPLOAD
===================================================== -->

<section class="upload-box">

    <h2>⬆️ Fayl yuklash</h2>

    <p>
        Telefon yoki kompyuterdan fayl tanlang
    </p>

    <!-- BITTA FAYL -->

    <label
        class="upload-btn"
        for="fileInput">
        📤 Fayl tanlash
    </label>

    <input
        type="file"
        id="fileInput">


    <!-- BUTUN PAPKA -->

    <label
        class="upload-btn folder-btn"
        for="folderInput">
        📁 Papka tanlash
    </label>

    <input
        type="file"
        id="folderInput"
        webkitdirectory
        directory
        multiple>


    <div id="uploadStatus"></div>

</section>


<!-- =====================================================
     TOOLBAR
===================================================== -->

<section class="toolbar">

    <input
        type="text"
        id="searchInput"
        class="search"
        placeholder="🔍 Fayl yoki papka qidirish..."
        oninput="filterItems()">

    <button
        class="action-btn blue"
        onclick="createFolder()">
        📁 Yangi papka
    </button>

    <button
        class="action-btn"
        onclick="goBack()">
        ↩️ Orqaga
    </button>

    <button
        class="action-btn"
        onclick="loadCurrentFolder()">
        🔄 Yangilash
    </button>

</section>


<!-- =====================================================
     FILE LIST
===================================================== -->

<section class="files-card">

    <div class="files-header">

        <div>

            <h2>
                📂 <span id="currentTitle">
                    Fayllar
                </span>
            </h2>

            <div
                class="path"
                id="currentPath">
                Bosh papka
            </div>

        </div>

    </div>

    <div id="fileList">

        <div class="empty">
            ⏳ Yuklanmoqda...
        </div>

    </div>

</section>

</main>

</section>


<!-- =====================================================
     PREVIEW MODAL
===================================================== -->

<div
    id="previewModal"
    class="modal hidden"
    onclick="closePreview(event)">

    <div class="modal-box">

        <div class="modal-header">

            <strong id="previewTitle">
                Ko‘rish
            </strong>

            <button
                class="close-btn"
                onclick="closePreview()">
                ✕
            </button>

        </div>

        <div id="previewContent"></div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://xfhxkdbwvhzdcbzlnnim.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_hkxNeCCzHufwArjRe5g0Dg_LgRS6Dlv";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const BUCKET = "files";


/* =====================================================
   ELEMENTS
===================================================== */

const authPage =
    document.getElementById("authPage");

const cloudPage =
    document.getElementById("cloudPage");

const authTitle =
    document.getElementById("authTitle");

const authButton =
    document.getElementById("authButton");

const switchButton =
    document.getElementById("switchButton");

const authMessage =
    document.getElementById("authMessage");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const fileInput =
    document.getElementById("fileInput");

const folderInput =
    document.getElementById("folderInput");

const avatarInput =
    document.getElementById("avatarInput");

const fileList =
    document.getElementById("fileList");

const userEmail =
    document.getElementById("userEmail");

const profileEmail =
    document.getElementById("profileEmail");

const profileName =
    document.getElementById("profileName");

const uploadStatus =
    document.getElementById("uploadStatus");

const currentTitle =
    document.getElementById("currentTitle");

const currentPath =
    document.getElementById("currentPath");

const searchInput =
    document.getElementById("searchInput");

const storageText =
    document.getElementById("storageText");

const storageBar =
    document.getElementById("storageBar");

const avatarContainer =
    document.getElementById("avatarContainer");

const previewModal =
    document.getElementById("previewModal");

const previewContent =
    document.getElementById("previewContent");

const previewTitle =
    document.getElementById("previewTitle");


let registerMode = false;

let currentFolder = "";

let allItems = [];


/* =====================================================
   AUTH MODE
===================================================== */

function toggleAuth(){

    registerMode = !registerMode;

    if(registerMode){

        authTitle.textContent =
            "Yangi hisob yarating";

        authButton.textContent =
            "Ro‘yxatdan o‘tish";

        switchButton.textContent =
            "Hisobingiz bormi? Kirish";

    }else{

        authTitle.textContent =
            "Hisobingizga kiring";

        authButton.textContent =
            "Kirish";

        switchButton.textContent =
            "Hisobingiz yo‘qmi? Ro‘yxatdan o‘ting";
    }

    authMessage.textContent = "";
}


/* =====================================================
   LOGIN / REGISTER
===================================================== */

async function login(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    if(!email || !password){

        showAuthMessage(
            "Email va parolni kiriting.",
            "red"
        );

        return;
    }

    authButton.disabled = true;

    try{

        if(registerMode){

            const {data,error} =
                await supabaseClient.auth.signUp({
                    email,
                    password
                });

            if(error){
                throw error;
            }

            showAuthMessage(
                "Ro‘yxatdan o‘tildi.",
                "green"
            );

            if(data.session){
                showCloud(data.session.user);
            }

        }else{

            const {data,error} =
                await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

            if(error){
                throw error;
            }

            showCloud(data.user);
        }

    }catch(error){

        showAuthMessage(
            error.message,
            "red"
        );

    }finally{

        authButton.disabled = false;
    }
}


/* =====================================================
   AUTH MESSAGE
===================================================== */

function showAuthMessage(
    message,
    color
){

    authMessage.textContent =
        message;

    authMessage.style.color =
        color;
}


/* =====================================================
   SHOW CLOUD
===================================================== */

async function showCloud(user){

    window.currentUser = user;

    authPage.classList.add("hidden");

    cloudPage.classList.remove("hidden");

    userEmail.textContent =
        user.email;

    profileEmail.textContent =
        user.email;

    profileName.textContent =
        "SkyDriveX foydalanuvchisi";

    currentFolder = "";

    await loadAvatar();

    await loadCurrentFolder();

    await calculateStorage();
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    window.currentUser = null;

    cloudPage.classList.add("hidden");

    authPage.classList.remove("hidden");

    emailInput.value = "";

    passwordInput.value = "";

    fileList.innerHTML = "";

    currentFolder = "";
}


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession(){

    const {
        data:{
            session
        }
    } =
        await supabaseClient.auth.getSession();

    if(session){

        window.currentUser =
            session.user;

        await showCloud(
            session.user
        );

    }else{

        authPage.classList.remove("hidden");

        cloudPage.classList.add("hidden");
    }
}


/* =====================================================
   USER
===================================================== */

async function getUser(){

    const {
        data:{
            user
        }
    } =
        await supabaseClient.auth.getUser();

    return user;
}


/* =====================================================
   FULL USER PATH
===================================================== */

function fullUserPath(path){

    const user =
        window.currentUser;

    if(!user){
        return path;
    }

    return user.id +
        (path ? "/" + path : "");
}


/* =====================================================
   SAFE NAME
===================================================== */

function safeFileName(name){

    return name
        .normalize("NFKD")
        .replace(/[^\x00-\x7F]/g,"")
        .replace(/[^a-zA-Z0-9._-]/g,"_");
}


/* =====================================================
   SINGLE FILE UPLOAD
===================================================== */

fileInput.addEventListener(
    "change",
    async function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }

        const user =
            await getUser();

        if(!user){

            alert(
                "Avval tizimga kiring."
            );

            return;
        }

        uploadStatus.textContent =
            "⏳ Fayl yuklanmoqda...";

/* =====================================================
   FOLDER UPLOAD
===================================================== */

folderInput.addEventListener(
    "change",
    async function(){

        const files =
            Array.from(this.files);

        if(!files.length){
            return;
        }

        const user =
            await getUser();

        if(!user){

            alert(
                "Avval tizimga kiring."
            );

            this.value = "";

            return;
        }

        uploadStatus.textContent =
            "⏳ " +
            files.length +
            " ta fayl tayyorlanmoqda...";

        let success = 0;

        let failed = 0;

        try{

            for(
                const file of files
            ){

                try{

                    const relativePath =
                        file.webkitRelativePath;

                    if(!relativePath){
                        failed++;
                        continue;
                    }

                    const parts =
                        relativePath
                        .split("/")
                        .filter(Boolean);

                    if(parts.length < 2){

                        failed++;

                        continue;
                    }

                    /*
                      Masalan:

                      MyFolder/
                      MyFolder/video.mp4
                      MyFolder/2026/test.mp4

                      parts:

                      [
                        "MyFolder",
                        "2026",
                        "test.mp4"
                      ]
                    */

                    const rootFolder =
                        safeFileName(
                            parts[0]
                        );

                    const folders =
                        parts.slice(
                            1,
                            -1
                        );

                    const safeFolders =
                        folders.map(
                            folder =>
                                safeFileName(
                                    folder
                                )
                        );

                    const safeName =
                        safeFileName(
                            parts[
                                parts.length - 1
                            ]
                        );

                    let uploadPath =
                        user.id + "/";

                    /*
                      Agar hozir biror papka
                      ichida turgan bo‘lsak
                    */

                    if(currentFolder){

                        uploadPath +=
                            currentFolder +
                            "/";
                    }

                    /*
                      Tanlangan asosiy papka
                    */

                    uploadPath +=
                        rootFolder + "/";

                    /*
                      Ichki papkalar
                    */

                    if(
                        safeFolders.length
                    ){

                        uploadPath +=
                            safeFolders.join(
                                "/"
                            ) +
                            "/";
                    }

                    /*
                      Bir xil nomdagi fayllar
                      ustma-ust tushmasligi uchun
                      timestamp
                    */

                    const uniqueName =
                        Date.now() +
                        "_" +
                        Math.random()
                            .toString(36)
                            .substring(2,8) +
                        "_" +
                        safeName;

                    uploadPath +=
                        uniqueName;

                    const {error} =
                        await supabaseClient
                            .storage
                            .from(BUCKET)
                            .upload(
                                uploadPath,
                                file,
                                {
                                    upsert:false,
                                    contentType:
                                        file.type
                                }
                            );

                    if(error){

                        console.error(
                            "Fayl:",
                            file.name,
                            error
                        );

                        failed++;

                    }else{

                        success++;
                    }

                }catch(fileError){

                    console.error(
                        "Fayl xatosi:",
                        file.name,
                        fileError
                    );

                    failed++;
                }

                uploadStatus.textContent =
                    "⏳ Yuklanmoqda: " +
                    (success + failed) +
                    " / " +
                    files.length;
            }

            uploadStatus.textContent =
                "✅ " +
                success +
                " ta fayl yuklandi." +
                (
                    failed > 0
                    ?
                    " ❌ " +
                    failed +
                    " ta fayl yuklanmadi."
                    :
                    ""
                );

            this.value = "";

            await loadCurrentFolder();

            await calculateStorage();

        }catch(error){

            console.error(error);

            uploadStatus.textContent =
                "❌ " +
                error.message;

            this.value = "";
        }
    }
);

/* =====================================================
   RENDER ITEMS
===================================================== */

function renderItems(items){

    fileList.innerHTML = "";

    if(
        !items ||
        items.length === 0
    ){

        fileList.innerHTML =
            `<div class="empty">
                📂 Bu papka bo‘sh
             </div>`;

        return;
    }

    items.forEach(
        item => {

            if(!item.name){
                return;
            }

            const isFolder =
                !item.metadata;

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "file " +
                (
                    isFolder
                    ? "folder"
                    : ""
                );

            if(isFolder){

                div.innerHTML = `

                    <div
                        class="file-left"
                        onclick="openFolder('${escapeJs(item.name)}')"
                        style="cursor:pointer;">

                        <div class="file-icon">
                            📁
                        </div>

                        <div class="file-info">

                            <div
                                class="file-name folder-name">
                                ${escapeHtml(item.name)}
                            </div>

                            <div class="file-size">
                                Papka
                            </div>

                        </div>

                    </div>

                    <div class="file-actions">

                        <button
                            class="btn"
                            onclick="openFolder('${escapeJs(item.name)}')">
                            📂 Kirish
                        </button>

                        <button
                            class="btn delete"
                            onclick="deleteFolder('${escapeJs(item.name)}')">
                            🗑️ O‘chirish
                        </button>

                    </div>
                `;

            }else{

                const relativePath =
                    currentFolder
                    ?
                    currentFolder +
                    "/" +
                    item.name
                    :
                    item.name;

                const fullPath =
                    fullUserPath(
                        relativePath
                    );

                const size =
                    formatSize(
                        item.metadata?.size ||
                        0
                    );

                const type =
                    getFileType(
                        item.name
                    );

                div.innerHTML = `

                    <div class="file-left">

                        <div class="file-icon">
                            ${getFileIcon(type)}
                        </div>

                        <div class="file-info">

                            <div class="file-name">
                                ${escapeHtml(item.name)}
                            </div>

                            <div class="file-size">
                                ${size}
                            </div>

                        </div>

                    </div>

                    <div class="file-actions">

                        ${
                            isPreviewable(type)
                            ?
                            `
                            <button
                                class="btn preview"
                                onclick="previewFile('${escapeJs(fullPath)}','${type}','${escapeJs(item.name)}')">
                                👁️ Ko‘rish
                            </button>
                            `
                            :
                            ""
                        }

                        <button
                            class="btn"
                            onclick="downloadFile('${escapeJs(fullPath)}')">
                            ⬇️
                        </button>

                        <button
                            class="btn delete"
                            onclick="deleteFile('${escapeJs(fullPath)}')">
                            🗑️
                        </button>

                    </div>
                `;
            }

            fileList.appendChild(
                div
            );
        }
    );
}

/* =====================================================

===================================================== */

async function deleteFolderRecursive(
    folderPath
){

    const {data,error} =
        await supabaseClient
            .storage
            .from(BUCKET)
            .list(
                folderPath,
                {
                    limit:1000
                }
            );

    if(error){
        throw error;
    }

    if(
        !data ||
        data.length === 0
    ){

        return;
    }

    const filesToDelete = [];

    for(
        const item of data
    ){

        if(!item.name){
            continue;
        }

        const childPath =
            folderPath +
            "/" +
            item.name;

        if(item.metadata){

            filesToDelete.push(
                childPath
            );

        }else{

            await deleteFolderRecursive(
                childPath
            );
        }
    }

    if(
        filesToDelete.length
    ){

        const {
            error:removeError
        } =
            await supabaseClient
                .storage
                .from(BUCKET)
                .remove(
                    filesToDelete
                );

        if(removeError){
            throw removeError;
        }
    }
}

/* =====================================================
   FILE TYPES
===================================================== */

function getFileType(name){

    const ext =
        name
            .split(".")
            .pop()
            .toLowerCase();

    if([
        "jpg",
        "jpeg",
        "png",
        "gif",
        "webp",
        "bmp",
        "svg"
    ].includes(ext)){

        return "image";
    }

    if([
        "mp4",
        "webm",
        "mov",
        "mkv",
        "avi"
    ].includes(ext)){

        return "video";
    }

    if([
        "mp3",
        "wav",
        "ogg",
        "m4a",
        "aac",
        "flac"
    ].includes(ext)){

        return "audio";
    }

    if([
        "pdf"
    ].includes(ext)){

        return "pdf";
    }

    return "file";
}

    if(

    }

    return "📄";
}

/* =====================================================
   STORAGE CALCULATOR
===================================================== */

async function calculateStorage(){

    const user =
        await getUser();

    if(!user){
        return;
    }

    let total = 0;

    try{

        await calculateFolderSize(
            user.id,
            value => {
                total = value;
            }
        );

        const limit =
            1024 *
            1024 *
            1024;

        const percent =
            Math.min(
                100,
                (
                    total /
                    limit
                ) * 100
            );

        storageText.textContent =
            formatSize(total) +
            " / 1 GB";

        storageBar.style.width =
            percent +
            "%";

    }catch(error){

        console.error(
            "Storage hisoblash:",
            error
        );
    }
}


/* =====================================================
   CALCULATE FOLDER SIZE
===================================================== */

async function calculateFolderSize(
    folder,
    callback,
    total = 0
){

    const {data,error} =
        await supabaseClient
            .storage
            .from(BUCKET)
            .list(
                folder,
                {
                    limit:1000
                }
            );

    if(error){
        throw error;
    }

    if(!data){

        callback(total);

        return total;
    }

    for(
        const item of data
    ){

        if(!item.name){
            continue;
        }

        const path =
            folder +
            "/" +
            item.name;

        if(item.metadata){

            /*
              .keep faylini storage
              hisobiga qo‘shmaymiz
            */

            if(
                item.name !==
                ".keep"
            ){

                total +=
                    Number(
                        item.metadata
                            ?.size ||
                        0
                    );
            }

        }else{

            total =
                await calculateFolderSize(
                    path,
                    callback,
                    total
                );
        }
    }

    callback(total);

    return total;
}


/* =====================================================
   FORMAT SIZE
===================================================== */

function formatSize(bytes){

    if(!bytes){
        return "0 B";
    }

    const units =
        [
            "B",
            "KB",
            "MB",
            "GB",
            "TB"
        ];

    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    return (
        parseFloat(
            (
                bytes /
                Math.pow(
                    1024,
                    i
                )
            ).toFixed(2)
        )
        +
        " " +
        units[i]
    );
}


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHtml(text){

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeJs(text){

    return String(text)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );
}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        if(
            event ===
            "SIGNED_IN" &&
            session
        ){

            window.currentUser =
                session.user;
        }

        if(
            event ===
            "SIGNED_OUT"
        ){

            window.currentUser =
                null;
        }
    }
);
